---
id: jira
display_name: Jira
description: Jira access for test-plan generation
category: data
credentials:
  - name: api_token
    description: Jira API token
    env_vars: [JIRA_TOKEN]
    required: true
endpoints:
  - host: "redhat.atlassian.net"
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
binaries:
  - "**/python"
  - "**/python*"
  - "**/python3"
  - "**/curl"
